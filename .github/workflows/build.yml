name: Build Vial Firmware

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli:latest

    steps:
      - name: Checkout vial-qmk
        uses: actions/checkout@v4
        with:
          repository: vial-kb/vial-qmk
          ref: vial
          submodules: recursive
          path: vial-qmk

      - name: Checkout keyboard source
        uses: actions/checkout@v4
        with:
          path: keyboard_src

      - name: Setup keyboard directory
        run: |
          mkdir -p vial-qmk/keyboards/doio/kb16/rev2
          if [ -f keyboard_src/rules.mk ] || [ -f keyboard_src/info.json ]; then
            cp -r keyboard_src/* vial-qmk/keyboards/doio/kb16/rev2/
          elif [ -d keyboard_src/keyboards ]; then
            cp -r keyboard_src/keyboards/* vial-qmk/keyboards/
          else
            cp -r keyboard_src/* vial-qmk/keyboards/doio/kb16/rev2/
          fi
          echo "=== Check directory structure ==="
          ls -la vial-qmk/keyboards/doio/kb16/rev2

      - name: Build Firmware
        run: |
          cd vial-qmk
          git config --global --add safe.directory $(pwd)
          qmk setup -y || true
          qmk compile -kb doio/kb16/rev2 -km vial

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kb16_rev2_vial_firmware
          path: |
            vial-qmk/*.bin
            vial-qmk/*.hex
            vial-qmk/*.uf2
