name: Build Vial Firmware

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli:latest

    steps:
      - name: Checkout vial-qmk
        uses: actions/checkout@v4
        with:
          repository: vial-kb/vial-qmk
          ref: vial
          submodules: recursive
          path: vial-qmk

- name: Checkout keyboard source
        uses: actions/checkout@v4
        with:
          path: vial-qmk/keyboards/doio

      - name: Build Firmware
        run: |
          cd vial-qmk
          git config --global --add safe.directory $(pwd)
          qmk setup -y || true
          qmk compile -kb doio/kb16/rev2 -km vial

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kb16_rev2_vial_firmware
          path: |
            vial-qmk/*.bin
            vial-qmk/*.hex
            vial-qmk/*.uf2
